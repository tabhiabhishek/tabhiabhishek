<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="290" rx="14" fill="#0f141a"/>
  <rect x="0.5" y="0.5" width="1279" height="289" rx="14" fill="none" stroke="#2a323d"/>

  <!-- card 1: Speech AI -->
  <rect x="30" y="30" width="290" height="230" rx="12" fill="#161c24" stroke="#2a323d"/>
  <rect x="30" y="30" width="290" height="6" rx="3" fill="#22c55e"/>
  <g fill="#22c55e">
    <rect x="54" y="72" width="6" height="16" rx="3"/><rect x="64" y="64" width="6" height="32" rx="3"/>
    <rect x="74" y="58" width="6" height="44" rx="3"/><rect x="84" y="68" width="6" height="24" rx="3"/>
  </g>
  <text x="104" y="88" font-size="19" font-weight="700" fill="#f3f4f6">Speech AI</text>
  <g font-size="14" fill="#9ca3af">
