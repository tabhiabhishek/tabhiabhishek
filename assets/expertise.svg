    <text x="674" y="162">OCR and document AI</text>
    <text x="674" y="188">Model optimization</text>
    <text x="674" y="214">Production deployment</text>
  </g>

  <!-- card 4: GPU & production -->
  <rect x="960" y="30" width="290" height="230" rx="12" fill="#161c24" stroke="#2a323d"/>
  <rect x="960" y="30" width="290" height="6" rx="3" fill="#f59e0b"/>
  <rect x="984" y="62" width="34" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/>
