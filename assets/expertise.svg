    <text x="54" y="214">CEA-608 · SRT output</text>
  </g>

  <!-- card 2: LLM apps -->
  <rect x="340" y="30" width="290" height="230" rx="12" fill="#161c24" stroke="#2a323d"/>
  <rect x="340" y="30" width="290" height="6" rx="3" fill="#38bdf8"/>
  <rect x="364" y="62" width="34" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M372 88 v8 l8 -8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <text x="414" y="88" font-size="19" font-weight="700" fill="#f3f4f6">LLM Applications</text>
  <g font-size="14" fill="#9ca3af">
    <text x="364" y="136">RAG with LangChain + ChromaDB</text>
