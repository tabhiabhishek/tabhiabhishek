  <g stroke="#f59e0b" stroke-width="2"><line x1="990" y1="56" x2="990" y2="62"/><line x1="1001" y1="56" x2="1001" y2="62"/><line x1="1012" y1="56" x2="1012" y2="62"/></g>
  <text x="1034" y="88" font-size="18" font-weight="700" fill="#f3f4f6">GPU &amp; Production ML</text>
  <g font-size="14" fill="#9ca3af">
