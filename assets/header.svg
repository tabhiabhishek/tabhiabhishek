<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .bar { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s } .b5 { animation-delay: .6s }
      .b6 { animation-delay: .75s } .b7 { animation-delay: .9s } .b8 { animation-delay: 1.05s } .b9 { animation-delay: 1.2s }
      @keyframes pulse { 0%,100% { transform: scaleY(.45) } 50% { transform: scaleY(1) } }
      .node { animation: glow 3s ease-in-out infinite; }
      .n2 { animation-delay: 1s } .n3 { animation-delay: 2s }
      @keyframes glow { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .fade { animation: fadein 1.2s ease-out both; }
      .f2 { animation-delay: .3s } .f3 { animation-delay: .6s }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#2a323d"/>

  <!-- left: animated waveform (speech) -->
  <g fill="url(#accent)">
    <rect class="bar"    x="70"  y="100" width="10" height="100" rx="5"/>
    <rect class="bar b2" x="90"  y="80"  width="10" height="140" rx="5"/>
    <rect class="bar b3" x="110" y="110" width="10" height="80"  rx="5"/>
    <rect class="bar b4" x="130" y="70"  width="10" height="160" rx="5"/>
    <rect class="bar b5" x="150" y="95"  width="10" height="110" rx="5"/>
    <rect class="bar b6" x="170" y="115" width="10" height="70"  rx="5"/>
    <rect class="bar b7" x="190" y="85"  width="10" height="130" rx="5"/>
    <rect class="bar b8" x="210" y="105" width="10" height="90"  rx="5"/>
    <rect class="bar b9" x="230" y="125" width="10" height="50"  rx="5"/>
  </g>

  <!-- right: small neural net (LLMs) -->
  <g stroke="#2a323d" stroke-width="2">
    <line x1="1060" y1="90" x2="1140" y2="120"/><line x1="1060" y1="90" x2="1140" y2="180"/>
    <line x1="1060" y1="150" x2="1140" y2="120"/><line x1="1060" y1="150" x2="1140" y2="180"/>
    <line x1="1060" y1="210" x2="1140" y2="120"/><line x1="1060" y1="210" x2="1140" y2="180"/>
    <line x1="1140" y1="120" x2="1210" y2="150"/><line x1="1140" y1="180" x2="1210" y2="150"/>
  </g>
  <circle class="node"    cx="1060" cy="90"  r="10" fill="#22c55e"/>
  <circle class="node n2" cx="1060" cy="150" r="10" fill="#38bdf8"/>
  <circle class="node n3" cx="1060" cy="210" r="10" fill="#a78bfa"/>
  <circle class="node n2" cx="1140" cy="120" r="10" fill="#f59e0b"/>
  <circle class="node n3" cx="1140" cy="180" r="10" fill="#22c55e"/>
  <circle class="node"    cx="1210" cy="150" r="12" fill="#38bdf8"/>

  <!-- center text -->
  <text class="fade" x="640" y="122" text-anchor="middle" font-size="22" fill="#9ca3af" letter-spacing="3">HI, I'M</text>
  <text class="fade f2" x="640" y="182" text-anchor="middle" font-size="62" font-weight="700" fill="#f3f4f6">Abhishek <tspan fill="url(#accent)">Tiwari</tspan></text>
  <text class="fade f3" x="640" y="228" text-anchor="middle" font-size="24" fill="#d1d5db">AI/ML Engineer · Speech AI · LLMs · Computer Vision</text>
</svg>
